<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate UUID v4, UUID v7, and ULID identifiers">
    <title>UUID & ULID Generator | tools.</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/workbench.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&display=swap">
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="tool-page-shell">
    <a class="skip-link" href="#main-content">Skip to tool</a>
    <header class="top-bar">
        <a href="../index.html" class="top-bar__brand" aria-label="tools home"><img src="../assets/logo.svg" alt="" width="24" height="24"><span>tools.</span></a>
        <div class="top-bar__spacer"></div>
        <div class="top-bar__actions">
            <a class="icon-btn" href="https://github.com/irfansofyana/tools" target="_blank" rel="noopener" aria-label="GitHub repository">
                <i class="fab fa-github" aria-hidden="true"></i>
            </a>
            <button class="theme-toggle-btn" id="theme-toggle-btn" aria-label="Toggle dark and light theme" aria-pressed="false">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </div>
    </header>

    <main id="main-content">
        <section class="tool-container">
            <div class="container">
                <a href="../index.html" class="back-link">all tools</a>
                <div class="tool-header">
                    <h1>UUID & ULID Generator</h1>
                </div>
                <div class="tool-description">
                    <p>Generate random UUID v4 identifiers, timestamp-sortable UUID v7 identifiers, and compact ULIDs for databases, logs, fixtures, and distributed systems.</p>
                </div>

                <div class="tool-content">
                    <div class="error-message hidden" id="error-message"></div>
                    
                    <div class="options-group mt-2 mb-2">
                        <label>Options:</label>
                        <div class="options-controls">
                            <label>
                                <select id="type-option">
                                    <option value="v4">UUID v4</option>
                                    <option value="v7">UUID v7</option>
                                    <option value="ulid">ULID</option>
                                </select>
                                Type
                            </label>
                            <label>
                                <input type="checkbox" id="uppercase-option">
                                Uppercase
                            </label>
                            <label>
                                <input type="checkbox" id="hyphens-option" checked>
                                Include Hyphens
                            </label>
                            <label>
                                <select id="quantity-option">
                                    <option value="1">1 ID</option>
                                    <option value="5">5 IDs</option>
                                    <option value="10">10 IDs</option>
                                    <option value="25">25 IDs</option>
                                    <option value="50">50 IDs</option>
                                </select>
                                Quantity
                            </label>
                        </div>
                    </div>
                    
                    <div class="text-center">
                        <button class="primary" id="generate-btn">Generate IDs</button>
                    </div>

                    <div class="result-container hidden" id="result-container">
                        <h3>Generated IDs:</h3>
                        <div class="input-group">
                            <textarea id="result-text" readonly aria-label="Result"></textarea>
                            <div class="input-controls">
                                <button class="secondary" id="copy-result">Copy All</button>
                                <button class="secondary" id="generate-new">Generate New</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <p>
            &copy; <span id="current-year">2025</span> ·
            <a href="https://github.com/irfansofyana/tools" target="_blank" rel="noopener">source</a> ·
            <a href="https://github.com/irfansofyana/tools/issues" target="_blank" rel="noopener">report an issue</a> ·
            <a href="../index.html">all tools</a>
        </p>
    </footer>

    <script src="../js/theme.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const resultText = document.getElementById('result-text');
            const generateBtn = document.getElementById('generate-btn');
            const generateNewBtn = document.getElementById('generate-new');
            const resultContainer = document.getElementById('result-container');
            const errorMessage = document.getElementById('error-message');
            const copyResultBtn = document.getElementById('copy-result');
            const typeOption = document.getElementById('type-option');
            const uppercaseOption = document.getElementById('uppercase-option');
            const hyphensOption = document.getElementById('hyphens-option');
            const quantityOption = document.getElementById('quantity-option');
            const crockford = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
            
            // Show error message
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.classList.remove('hidden');
                setTimeout(() => {
                    errorMessage.classList.add('hidden');
                }, 5000);
            }
            
            function randomBytes(length) {
                const bytes = new Uint8Array(length);
                if (crypto?.getRandomValues) {
                    crypto.getRandomValues(bytes);
                    return bytes;
                }
                for (let i = 0; i < length; i++) bytes[i] = Math.floor(Math.random() * 256);
                return bytes;
            }

            function bytesToUuid(bytes) {
                const hex = [...bytes].map((byte) => byte.toString(16).padStart(2, '0')).join('');
                return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
            }

            function generateUUIDv4() {
                const bytes = randomBytes(16);
                bytes[6] = (bytes[6] & 0x0f) | 0x40;
                bytes[8] = (bytes[8] & 0x3f) | 0x80;
                return bytesToUuid(bytes);
            }

            function generateUUIDv7() {
                const bytes = randomBytes(16);
                let timestamp = Date.now();
                for (let i = 5; i >= 0; i--) {
                    bytes[i] = timestamp & 0xff;
                    timestamp = Math.floor(timestamp / 256);
                }
                bytes[6] = (bytes[6] & 0x0f) | 0x70;
                bytes[8] = (bytes[8] & 0x3f) | 0x80;
                return bytesToUuid(bytes);
            }

            function encodeTime(time, length) {
                let value = time;
                let output = '';
                for (let i = length - 1; i >= 0; i--) {
                    output = crockford[value % 32] + output;
                    value = Math.floor(value / 32);
                }
                return output;
            }

            function generateULID() {
                const bytes = randomBytes(16);
                let randomPart = '';
                for (let i = 0; i < 16; i++) {
                    randomPart += crockford[bytes[i] & 31];
                }
                return `${encodeTime(Date.now(), 10)}${randomPart}`;
            }

            function generateID() {
                if (typeOption.value === 'v7') return generateUUIDv7();
                if (typeOption.value === 'ulid') return generateULID();
                return generateUUIDv4();
            }
            
            // Format generated ID based on options
            function formatID(id) {
                let formattedID = id;
                
                if (typeOption.value !== 'ulid' && !hyphensOption.checked) {
                    formattedID = formattedID.replace(/-/g, '');
                }
                
                if (uppercaseOption.checked) {
                    formattedID = formattedID.toUpperCase();
                }
                
                return formattedID;
            }
            
            // Generate IDs
            function generateUUIDs() {
                try {
                    const quantity = parseInt(quantityOption.value);
                    const ids = [];
                    
                    for (let i = 0; i < quantity; i++) {
                        ids.push(formatID(generateID()));
                    }
                    
                    resultText.value = ids.join('\n');
                    resultContainer.classList.remove('hidden');
                } catch (error) {
                    showError(`Error: ${error.message}`);
                }
            }
            
            // Copy result to clipboard
            function copyResult() {
                resultText.select();
                document.execCommand('copy');
                
                // Show temporary success message
                const originalText = copyResultBtn.textContent;
                copyResultBtn.textContent = 'Copied!';
                setTimeout(() => {
                    copyResultBtn.textContent = originalText;
                }, 2000);
            }
            
            // Event listeners
            generateBtn.addEventListener('click', generateUUIDs);
            generateNewBtn.addEventListener('click', generateUUIDs);
            copyResultBtn.addEventListener('click', copyResult);
            typeOption.addEventListener('change', () => {
                hyphensOption.disabled = typeOption.value === 'ulid';
                if (!resultContainer.classList.contains('hidden')) {
                    generateUUIDs();
                }
            });
            
            // Update result when options change
            uppercaseOption.addEventListener('change', () => {
                if (!resultContainer.classList.contains('hidden')) {
                    generateUUIDs();
                }
            });
            
            hyphensOption.addEventListener('change', () => {
                if (!resultContainer.classList.contains('hidden')) {
                    generateUUIDs();
                }
            });
            
            // Set current year in footer
            document.getElementById('current-year').textContent = new Date().getFullYear();
        });
    </script>
</body>
</html>
