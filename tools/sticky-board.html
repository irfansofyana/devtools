<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="A local-first visual workspace for rich notes, code cards, shapes, labels, and anchored connectors.">
    <meta name="theme-color" content="#f4f1ea">
    <link rel="canonical" href="https://tools.irfansp.dev/tools/sticky-board.html">
    <title>Sticky Board | tools.</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/workbench.css">
    <link rel="stylesheet" href="../css/sticky-board.css">
    <link rel="modulepreload" href="../vendor/sticky-board/tiptap-editor.mjs">
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
</head>
<body class="sticky-app">
    <a class="skip-link" href="#main-content">Skip to canvas</a>

    <header class="sticky-header">
        <a href="../index.html" class="sticky-brand" aria-label="Back to tools homepage">
            <img src="../assets/logo.svg" alt="" width="25" height="25">
            <span>tools.</span>
        </a>
        <span class="header-rule" aria-hidden="true"></span>
        <div class="board-identity">
            <span class="board-kicker">Sticky board</span>
            <label class="sr-only" for="board-select">Current board</label>
            <select id="board-select" aria-label="Current board"></select>
        </div>
        <button type="button" id="new-board" class="icon-button" title="New board" aria-label="Create new board">＋</button>

        <details class="header-menu board-menu">
            <summary class="icon-button" aria-label="Board options" title="Board options">•••</summary>
            <div class="menu-panel">
                <button type="button" id="rename-board">Rename board</button>
                <button type="button" id="delete-board" class="danger-text">Delete board</button>
            </div>
        </details>

        <div class="header-spacer"></div>
        <label class="search-control">
            <span aria-hidden="true" class="search-icon">⌕</span>
            <span class="sr-only">Search cards</span>
            <input id="card-search" type="search" placeholder="Find on this board" autocomplete="off">
        </label>
        <span id="storage-status" class="storage-status" aria-live="polite">Loading…</span>
        <button type="button" id="theme-toggle-btn" class="icon-button theme-button" aria-label="Toggle dark and light theme" aria-pressed="false">◐</button>
        <details class="header-menu workspace-menu">
            <summary class="icon-button" aria-label="Workspace options" title="Workspace options">☰</summary>
            <div class="menu-panel">
                <div class="menu-heading">Local workspace</div>
                <button type="button" id="persist-storage">Protect browser storage</button>
                <button type="button" id="export-workspace">Export backup</button>
                <label class="file-action" for="import-workspace-input">Import backup</label>
                <input id="import-workspace-input" type="file" accept="application/json,.json" hidden>
            </div>
        </details>
    </header>

    <main id="main-content">
        <section id="sticky-canvas" class="sticky-canvas" tabindex="0" aria-label="Infinite visual workspace">
            <div id="canvas-surface" class="canvas-surface" aria-live="off">
                <svg id="connector-layer" class="connector-layer" aria-label="Canvas connectors" overflow="visible">
                    <defs>
                        <marker id="connector-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12">
                            <path d="M 0 0 L 12 6 L 0 12 z" fill="context-stroke"></path>
                        </marker>
                    </defs>
                </svg>
            </div>
            <div id="connector-toolbar" class="connector-toolbar" role="toolbar" aria-label="Connector formatting" hidden>
                <input id="connector-label" maxlength="120" placeholder="Connector label" aria-label="Connector label">
                <select id="connector-stroke" aria-label="Connector color">
                    <option value="ink">Ink</option><option value="red">Red</option><option value="blue">Blue</option>
                    <option value="green">Green</option><option value="purple">Purple</option><option value="orange">Orange</option>
                </select>
                <select id="connector-style" aria-label="Connector style">
                    <option value="solid">Solid</option><option value="dashed">Dashed</option>
                </select>
                <select id="connector-arrow-style" aria-label="Connector arrow">
                    <option value="end">Arrow</option><option value="none">Line</option>
                </select>
                <button type="button" id="delete-connector" aria-label="Delete selected connector">Delete</button>
            </div>

            <nav class="canvas-dock" aria-label="Canvas view controls">
                <button type="button" id="zoom-out" class="dock-button" aria-label="Zoom out">−</button>
                <button type="button" id="zoom-reset" class="zoom-value" aria-label="Reset zoom">100%</button>
                <button type="button" id="zoom-in" class="dock-button" aria-label="Zoom in">＋</button>
                <button type="button" id="fit-cards" class="dock-button" aria-label="Fit all objects" title="Fit all objects">↙↗</button>
            </nav>

            <nav class="quick-create" aria-label="Add objects">
                <button type="button" id="add-note" class="empty-primary">Add note</button>
                <button type="button" id="add-code">Add code</button>
                <details class="insert-menu quick-insert-menu">
                    <summary id="empty-open-shapes">Add shapes <span aria-hidden="true">⌄</span></summary>
                    <div class="insert-panel" role="group" aria-label="Diagram objects">
                        <button type="button" id="add-rectangle"><span aria-hidden="true">□</span> Rectangle</button>
                        <button type="button" id="add-rounded"><span aria-hidden="true">▢</span> Rounded</button>
                        <button type="button" id="add-ellipse"><span aria-hidden="true">○</span> Ellipse</button>
                        <button type="button" id="add-diamond"><span aria-hidden="true">◇</span> Diamond</button>
                        <button type="button" id="add-text"><span aria-hidden="true">T</span> Text label</button>
                        <button type="button" id="add-connector"><span aria-hidden="true">→</span> Connector</button>
                    </div>
                </details>
            </nav>

            <div class="canvas-hint" id="canvas-hint">Drag the canvas to move · Choose Connector, then select two objects</div>
        </section>
    </main>

    <footer class="app-footer"><p>Local-first workspace · <a href="../index.html">all tools</a></p></footer>

    <template id="card-template">
        <article class="canvas-card" tabindex="0">
            <header class="card-header">
                <span class="card-grip" aria-hidden="true">⠿</span>
                <span class="card-kind"></span>
                <input class="card-title" maxlength="80" aria-label="Card title">
                <select class="card-color" aria-label="Card color" title="Card color">
                    <option value="yellow">● Yellow</option>
                    <option value="blue">● Blue</option>
                    <option value="green">● Green</option>
                    <option value="pink">● Pink</option>
                    <option value="purple">● Purple</option>
                    <option value="slate">● Slate</option>
                </select>
                <button type="button" class="card-copy card-action" aria-label="Copy card content" title="Copy content">⧉</button>
                <details class="card-object-menu">
                    <summary class="card-action" aria-label="Object actions" title="Object actions">•••</summary>
                    <div>
                        <button type="button" class="card-duplicate">Duplicate</button>
                        <button type="button" class="card-send-back">Send backward</button>
                        <button type="button" class="card-bring-front">Bring forward</button>
                    </div>
                </details>
                <button type="button" class="card-delete card-action" aria-label="Delete card" title="Delete">×</button>
            </header>

            <div class="code-toolbar">
                <label>Language
                    <select class="card-language">
                        <option value="javascript">JavaScript</option>
                        <option value="typescript">TypeScript</option>
                        <option value="python">Python</option>
                        <option value="bash">Bash</option>
                        <option value="json">JSON</option>
                        <option value="sql">SQL</option>
                        <option value="yaml">YAML</option>
                        <option value="markup">HTML</option>
                        <option value="css">CSS</option>
                        <option value="text">Plain text</option>
                    </select>
                </label>
                <button type="button" class="card-edit">Edit code</button>
                <button type="button" class="card-done">Done</button>
            </div>

            <div class="card-body">
                <div class="note-format-toolbar" role="toolbar" aria-label="Rich-text formatting">
                    <select class="block-style" aria-label="Block style">
                        <option value="paragraph">Text</option>
                        <option value="heading">Heading</option>
                    </select>
                    <button type="button" data-editor-action="bold" aria-label="Bold" title="Bold"><strong>B</strong></button>
                    <button type="button" data-editor-action="italic" aria-label="Italic" title="Italic"><em>I</em></button>
                    <button type="button" data-editor-action="strike" aria-label="Strikethrough" title="Strikethrough"><s>S</s></button>
                    <button type="button" data-editor-action="code" aria-label="Inline code" title="Inline code">&lt;/&gt;</button>
                    <span class="format-rule" aria-hidden="true"></span>
                    <button type="button" data-editor-action="task-list" aria-label="Checklist" title="Checklist">☑</button>
                    <button type="button" data-editor-action="bullet-list" aria-label="Bullet list" title="Bullet list">•≡</button>
                    <button type="button" data-editor-action="ordered-list" aria-label="Numbered list" title="Numbered list">1.</button>
                    <select class="text-size" aria-label="Text size">
                        <option value="">Size</option>
                        <option value="0.8rem">Small</option>
                        <option value="0.95rem">Normal</option>
                        <option value="1.1rem">Large</option>
                        <option value="1.35rem">Title</option>
                    </select>
                    <select class="text-color" aria-label="Text color">
                        <option value="">Ink</option>
                        <option value="#a33845">Red</option>
                        <option value="#1d5fab">Blue</option>
                        <option value="#157047">Green</option>
                        <option value="#7044a8">Purple</option>
                        <option value="#ad541f">Orange</option>
                    </select>
                    <span class="toolbar-spacer"></span>
                    <button type="button" data-editor-action="undo" aria-label="Undo" title="Undo">↶</button>
                    <button type="button" data-editor-action="redo" aria-label="Redo" title="Redo">↷</button>
                </div>
                <div class="note-editor"></div>
                <div class="card-preview"></div>
                <textarea class="card-editor" maxlength="200000" spellcheck="true" aria-label="Code content"></textarea>
            </div>
            <button type="button" class="card-resize" aria-label="Resize card with arrow keys" title="Resize card; use arrow keys for precise sizing"></button>
        </article>
    </template>

    <template id="shape-template">
        <article class="canvas-shape" tabindex="0">
            <div class="shape-toolbar" role="toolbar" aria-label="Shape formatting">
                <button type="button" class="shape-drag" aria-label="Move shape" title="Drag to move">⠿</button>
                <select class="shape-fill" aria-label="Shape fill">
                    <option value="yellow">Yellow</option><option value="blue">Blue</option><option value="green">Green</option>
                    <option value="pink">Pink</option><option value="purple">Purple</option><option value="slate">Slate</option>
                    <option value="transparent">Transparent</option>
                </select>
                <select class="shape-stroke" aria-label="Shape stroke">
                    <option value="ink">Ink</option><option value="red">Red</option><option value="blue">Blue</option>
                    <option value="green">Green</option><option value="purple">Purple</option><option value="orange">Orange</option>
                </select>
                <select class="shape-stroke-style" aria-label="Stroke style">
                    <option value="solid">Solid</option><option value="dashed">Dashed</option>
                </select>
                <button type="button" class="shape-send-back" aria-label="Send shape backward" title="Send backward">↓</button>
                <button type="button" class="shape-bring-front" aria-label="Bring shape forward" title="Bring forward">↑</button>
                <button type="button" class="shape-duplicate" aria-label="Duplicate shape" title="Duplicate">⧉</button>
                <button type="button" class="shape-delete" aria-label="Delete shape" title="Delete">×</button>
            </div>
            <div class="shape-frame">
                <textarea class="shape-label" maxlength="500" aria-label="Shape label" spellcheck="true"></textarea>
            </div>
            <button type="button" class="shape-resize" aria-label="Resize shape with arrow keys" title="Resize shape; use arrow keys for precise sizing"></button>
        </article>
    </template>

    <script src="../vendor/sticky-board/marked.min.js"></script>
    <script src="../vendor/sticky-board/purify.min.js"></script>
    <script src="../vendor/sticky-board/prism.js"></script>
    <script src="../vendor/sticky-board/prism-python.min.js"></script>
    <script src="../vendor/sticky-board/prism-bash.min.js"></script>
    <script src="../vendor/sticky-board/prism-json.min.js"></script>
    <script src="../vendor/sticky-board/prism-typescript.min.js"></script>
    <script src="../vendor/sticky-board/prism-sql.min.js"></script>
    <script src="../vendor/sticky-board/prism-yaml.min.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/main.js"></script>
    <script type="module" src="../js/sticky-board.mjs"></script>
</body>
</html>
