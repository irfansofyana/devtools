<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A local-first infinite canvas for rich notes, checklists, and code snippets.">
    <meta name="theme-color" content="#f4f1ea">
    <link rel="canonical" href="https://tools.irfansp.dev/tools/sticky-board.html">
    <title>Sticky Board | tools.</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/workbench.css">
    <link rel="stylesheet" href="../css/sticky-board.css">
    <link rel="modulepreload" href="../vendor/sticky-board/tiptap-editor.mjs">
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
</head>
<body class="sticky-app">
    <a class="skip-link" href="#main-content">Skip to canvas</a>

    <header class="sticky-header">
        <a href="../index.html" class="sticky-brand" aria-label="Back to tools homepage">
            <img src="../assets/logo.svg" alt="" width="25" height="25">
            <span>tools.</span>
        </a>
        <span class="header-rule" aria-hidden="true"></span>
        <div class="board-identity">
            <span class="board-kicker">Sticky board</span>
            <label class="sr-only" for="board-select">Current board</label>
            <select id="board-select" aria-label="Current board"></select>
        </div>
        <button type="button" id="new-board" class="icon-button" title="New board" aria-label="Create new board">＋</button>

        <details class="header-menu board-menu">
            <summary class="icon-button" aria-label="Board options" title="Board options">•••</summary>
            <div class="menu-panel">
                <button type="button" id="rename-board">Rename board</button>
                <button type="button" id="delete-board" class="danger-text">Delete board</button>
            </div>
        </details>

        <div class="header-spacer"></div>
        <label class="search-control">
            <span aria-hidden="true" class="search-icon">⌕</span>
            <span class="sr-only">Search cards</span>
            <input id="card-search" type="search" placeholder="Find on this board" autocomplete="off">
        </label>
        <span id="storage-status" class="storage-status" aria-live="polite">Loading…</span>
        <button type="button" id="theme-toggle-btn" class="icon-button theme-button" aria-label="Toggle dark and light theme" aria-pressed="false">◐</button>
        <details class="header-menu workspace-menu">
            <summary class="icon-button" aria-label="Workspace options" title="Workspace options">☰</summary>
            <div class="menu-panel">
                <div class="menu-heading">Local workspace</div>
                <button type="button" id="persist-storage">Protect browser storage</button>
                <button type="button" id="export-workspace">Export backup</button>
                <label class="file-action" for="import-workspace-input">Import backup</label>
                <input id="import-workspace-input" type="file" accept="application/json,.json" hidden>
            </div>
        </details>
    </header>

    <main id="main-content">
        <section id="sticky-canvas" class="sticky-canvas" tabindex="0" aria-label="Infinite sticky-note canvas">
            <div id="canvas-surface" class="canvas-surface" aria-live="off"></div>

            <nav class="canvas-dock" aria-label="Canvas tools">
                <button type="button" id="add-note" class="dock-primary"><span aria-hidden="true">＋</span><span>Note</span><kbd>N</kbd></button>
                <button type="button" id="add-code" class="dock-button" title="Add code card"><span aria-hidden="true">&lt;/&gt;</span><span class="sr-only">Add code card</span></button>
                <span class="dock-rule" aria-hidden="true"></span>
                <button type="button" id="zoom-out" class="dock-button" aria-label="Zoom out">−</button>
                <button type="button" id="zoom-reset" class="zoom-value" aria-label="Reset zoom">100%</button>
                <button type="button" id="zoom-in" class="dock-button" aria-label="Zoom in">＋</button>
                <button type="button" id="fit-cards" class="dock-button" aria-label="Fit all cards" title="Fit all cards">↙↗</button>
            </nav>

            <div class="canvas-hint" id="canvas-hint">Drag the canvas to move · Ctrl/⌘ + wheel to zoom</div>
            <div id="empty-state" class="empty-state" hidden>
                <span class="empty-mark" aria-hidden="true">✦</span>
                <strong>A quiet place for loud ideas.</strong>
                <span>Add a note, make a checklist, or pin a code snippet.</span>
            </div>
        </section>
    </main>

    <footer class="app-footer"><p>Local-first workspace · <a href="../index.html">all tools</a></p></footer>

    <template id="card-template">
        <article class="canvas-card" tabindex="0">
            <header class="card-header">
                <span class="card-grip" aria-hidden="true">⠿</span>
                <span class="card-kind"></span>
                <input class="card-title" maxlength="80" aria-label="Card title">
                <select class="card-color" aria-label="Card color" title="Card color">
                    <option value="yellow">● Yellow</option>
                    <option value="blue">● Blue</option>
                    <option value="green">● Green</option>
                    <option value="pink">● Pink</option>
                    <option value="purple">● Purple</option>
                    <option value="slate">● Slate</option>
                </select>
                <button type="button" class="card-copy card-action" aria-label="Copy card content" title="Copy">⧉</button>
                <button type="button" class="card-delete card-action" aria-label="Delete card" title="Delete">×</button>
            </header>

            <div class="code-toolbar">
                <label>Language
                    <select class="card-language">
                        <option value="javascript">JavaScript</option>
                        <option value="typescript">TypeScript</option>
                        <option value="python">Python</option>
                        <option value="bash">Bash</option>
                        <option value="json">JSON</option>
                        <option value="sql">SQL</option>
                        <option value="yaml">YAML</option>
                        <option value="markup">HTML</option>
                        <option value="css">CSS</option>
                        <option value="text">Plain text</option>
                    </select>
                </label>
                <button type="button" class="card-edit">Edit code</button>
                <button type="button" class="card-done">Done</button>
            </div>

            <div class="card-body">
                <div class="note-format-toolbar" role="toolbar" aria-label="Rich-text formatting">
                    <select class="block-style" aria-label="Block style">
                        <option value="paragraph">Text</option>
                        <option value="heading">Heading</option>
                    </select>
                    <button type="button" data-editor-action="bold" aria-label="Bold" title="Bold"><strong>B</strong></button>
                    <button type="button" data-editor-action="italic" aria-label="Italic" title="Italic"><em>I</em></button>
                    <button type="button" data-editor-action="strike" aria-label="Strikethrough" title="Strikethrough"><s>S</s></button>
                    <button type="button" data-editor-action="code" aria-label="Inline code" title="Inline code">&lt;/&gt;</button>
                    <span class="format-rule" aria-hidden="true"></span>
                    <button type="button" data-editor-action="task-list" aria-label="Checklist" title="Checklist">☑</button>
                    <button type="button" data-editor-action="bullet-list" aria-label="Bullet list" title="Bullet list">•≡</button>
                    <button type="button" data-editor-action="ordered-list" aria-label="Numbered list" title="Numbered list">1.</button>
                    <select class="text-size" aria-label="Text size">
                        <option value="">Size</option>
                        <option value="0.8rem">Small</option>
                        <option value="0.95rem">Normal</option>
                        <option value="1.1rem">Large</option>
                        <option value="1.35rem">Title</option>
                    </select>
                    <select class="text-color" aria-label="Text color">
                        <option value="">Ink</option>
                        <option value="#a33845">Red</option>
                        <option value="#1d5fab">Blue</option>
                        <option value="#157047">Green</option>
                        <option value="#7044a8">Purple</option>
                        <option value="#ad541f">Orange</option>
                    </select>
                    <span class="toolbar-spacer"></span>
                    <button type="button" data-editor-action="undo" aria-label="Undo" title="Undo">↶</button>
                    <button type="button" data-editor-action="redo" aria-label="Redo" title="Redo">↷</button>
                </div>
                <div class="note-editor"></div>
                <div class="card-preview"></div>
                <textarea class="card-editor" maxlength="200000" spellcheck="true" aria-label="Code content"></textarea>
            </div>
            <button type="button" class="card-resize" aria-label="Resize card with arrow keys" title="Resize card; use arrow keys for precise sizing"></button>
        </article>
    </template>

    <script src="../vendor/sticky-board/marked.min.js"></script>
    <script src="../vendor/sticky-board/purify.min.js"></script>
    <script src="../vendor/sticky-board/prism.js"></script>
    <script src="../vendor/sticky-board/prism-python.min.js"></script>
    <script src="../vendor/sticky-board/prism-bash.min.js"></script>
    <script src="../vendor/sticky-board/prism-json.min.js"></script>
    <script src="../vendor/sticky-board/prism-typescript.min.js"></script>
    <script src="../vendor/sticky-board/prism-sql.min.js"></script>
    <script src="../vendor/sticky-board/prism-yaml.min.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/main.js"></script>
    <script type="module" src="../js/sticky-board.mjs"></script>
</body>
</html>
