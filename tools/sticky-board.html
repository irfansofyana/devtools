<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A local-first infinite canvas for Markdown notes and code snippets.">
    <meta name="theme-color" content="#2257d8">
    <link rel="canonical" href="https://tools.irfansp.dev/tools/sticky-board.html">
    <title>Sticky Board | tools.</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/workbench.css">
    <link rel="stylesheet" href="../css/sticky-board.css">
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
</head>
<body class="sticky-app">
    <a class="skip-link" href="#main-content">Skip to canvas</a>
    <header class="sticky-header">
        <a href="../index.html" class="sticky-brand" aria-label="Back to tools homepage">
            <img src="../assets/logo.svg" alt="" width="24" height="24">
            <span>tools.</span>
        </a>
        <div class="board-controls">
            <label class="sr-only" for="board-select">Current board</label>
            <select id="board-select" aria-label="Current board"></select>
            <button type="button" id="new-board" title="New board" aria-label="Create new board">＋</button>
            <button type="button" id="rename-board">Rename</button>
            <button type="button" id="delete-board" class="danger-text">Delete</button>
        </div>
        <div class="header-spacer"></div>
        <span id="storage-status" class="storage-status" aria-live="polite">Loading local workspace…</span>
        <button type="button" id="theme-toggle-btn" class="theme-button" aria-label="Toggle dark and light theme" aria-pressed="false">◐</button>
    </header>

    <nav class="sticky-toolbar" aria-label="Sticky board tools">
        <button type="button" id="add-note" class="primary-action"><span aria-hidden="true">＋</span> Note</button>
        <button type="button" id="add-code"><span aria-hidden="true">⌘</span> Code</button>
        <label class="search-control">
            <span class="sr-only">Search cards</span>
            <input id="card-search" type="search" placeholder="Search this board…" autocomplete="off">
        </label>
        <div class="toolbar-spacer"></div>
        <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
        <button type="button" id="zoom-reset" aria-label="Reset zoom">100%</button>
        <button type="button" id="zoom-in" aria-label="Zoom in">＋</button>
        <button type="button" id="fit-cards">Fit cards</button>
        <details class="toolbar-menu">
            <summary>Workspace</summary>
            <div class="toolbar-menu__panel">
                <button type="button" id="persist-storage">Protect local storage</button>
                <button type="button" id="export-workspace">Export backup</button>
                <label class="file-action" for="import-workspace-input">Import backup</label>
                <input id="import-workspace-input" type="file" accept="application/json,.json" hidden>
            </div>
        </details>
    </nav>

    <main id="main-content">
    <section id="sticky-canvas" class="sticky-canvas" tabindex="0" aria-label="Infinite sticky-note canvas">
        <div id="canvas-surface" class="canvas-surface" aria-live="off"></div>
        <div class="canvas-hint" id="canvas-hint">Drag empty space to pan · Ctrl/⌘ + wheel to zoom · double-click a card to edit</div>
        <div id="empty-state" class="empty-state" hidden>
            <strong>Your canvas is empty.</strong>
            <span>Add a Markdown note or code snippet to start.</span>
        </div>
    </section>
    </main>

    <footer class="app-footer"><p>Local-first workspace · <a href="../index.html">all tools</a></p></footer>

    <template id="card-template">
        <article class="canvas-card" tabindex="0">
            <header class="card-header">
                <span class="card-kind"></span>
                <input class="card-title" maxlength="80" aria-label="Card title">
                <button type="button" class="card-copy" aria-label="Copy card content" title="Copy">Copy</button>
                <button type="button" class="card-delete" aria-label="Delete card" title="Delete">×</button>
            </header>
            <div class="card-toolbar">
                <label class="language-control">Language
                    <select class="card-language">
                        <option value="javascript">JavaScript</option>
                        <option value="typescript">TypeScript</option>
                        <option value="python">Python</option>
                        <option value="bash">Bash</option>
                        <option value="json">JSON</option>
                        <option value="sql">SQL</option>
                        <option value="yaml">YAML</option>
                        <option value="markup">HTML</option>
                        <option value="css">CSS</option>
                        <option value="text">Plain text</option>
                    </select>
                </label>
                <label class="color-control">Color
                    <select class="card-color">
                        <option value="yellow">Yellow</option>
                        <option value="blue">Blue</option>
                        <option value="green">Green</option>
                        <option value="pink">Pink</option>
                        <option value="purple">Purple</option>
                        <option value="slate">Slate</option>
                    </select>
                </label>
                <button type="button" class="card-edit">Edit</button>
                <button type="button" class="card-done">Done</button>
            </div>
            <div class="card-body">
                <div class="note-format-toolbar" role="toolbar" aria-label="Markdown formatting">
                    <button type="button" data-format="bold" aria-label="Bold" title="Bold"><strong>B</strong></button>
                    <button type="button" data-format="italic" aria-label="Italic" title="Italic"><em>I</em></button>
                    <button type="button" data-format="strike" aria-label="Strikethrough" title="Strikethrough"><s>S</s></button>
                    <button type="button" data-format="code" aria-label="Inline code" title="Inline code">&lt;/&gt;</button>
                    <label class="text-color-label"><span class="sr-only">Text color</span>
                        <select class="text-color" aria-label="Text color">
                            <option value="" selected>Color</option>
                            <option value="ink">Ink</option>
                            <option value="red">Red</option>
                            <option value="blue">Blue</option>
                            <option value="green">Green</option>
                            <option value="purple">Purple</option>
                            <option value="orange">Orange</option>
                        </select>
                    </label>
                </div>
                <div class="card-preview"></div>
                <textarea class="card-editor" maxlength="200000" spellcheck="true" aria-label="Card content"></textarea>
            </div>
            <button type="button" class="card-resize" aria-label="Resize card"></button>
        </article>
    </template>

    <script src="../vendor/sticky-board/marked.min.js"></script>
    <script src="../vendor/sticky-board/purify.min.js"></script>
    <script src="../vendor/sticky-board/prism.js"></script>
    <script src="../vendor/sticky-board/prism-python.min.js"></script>
    <script src="../vendor/sticky-board/prism-bash.min.js"></script>
    <script src="../vendor/sticky-board/prism-json.min.js"></script>
    <script src="../vendor/sticky-board/prism-typescript.min.js"></script>
    <script src="../vendor/sticky-board/prism-sql.min.js"></script>
    <script src="../vendor/sticky-board/prism-yaml.min.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/main.js"></script>
    <script type="module" src="../js/sticky-board.mjs"></script>
</body>
</html>
