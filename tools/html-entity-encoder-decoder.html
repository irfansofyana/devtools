<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Encode and decode HTML entities">
    <title>HTML Entity Encoder/Decoder | tools.</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/workbench.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&display=swap">
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="tool-page-shell">
    <a class="skip-link" href="#main-content">Skip to tool</a>
    <header class="top-bar">
        <a href="../index.html" class="top-bar__brand" aria-label="tools home"><img src="../assets/logo.svg" alt="" width="24" height="24"><span>tools.</span></a>
        <div class="top-bar__spacer"></div>
        <div class="top-bar__actions">
            <a class="icon-btn" href="https://github.com/irfansofyana/tools" target="_blank" rel="noopener" aria-label="GitHub repository">
                <i class="fab fa-github" aria-hidden="true"></i>
            </a>
            <button class="theme-toggle-btn" id="theme-toggle-btn" aria-label="Toggle dark and light theme" aria-pressed="false">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </div>
    </header>

    <main id="main-content">
        <section class="tool-container">
            <div class="container">
                <a href="../index.html" class="back-link">all tools</a>
                <div class="tool-header"><h1>HTML Entity Encoder/Decoder</h1></div>
                <div class="tool-description">
                    <p>Escape text for safe HTML display or decode named, decimal, and hex HTML entities back to plain text.</p>
                </div>

                <div class="tool-content">
                    <div class="options-group">
                        <label>Mode:</label>
                        <div class="options-controls">
                            <label><input type="radio" name="mode" value="encode" checked> Encode</label>
                            <label><input type="radio" name="mode" value="decode"> Decode</label>
                            <label><input type="checkbox" id="encode-nonascii"> Encode non-ASCII</label>
                        </div>
                    </div>

                    <div class="preview-container">
                        <div class="input-group">
                            <label for="input-text">Input:</label>
                            <textarea id="input-text" spellcheck="false" placeholder="Paste HTML text or entities..."></textarea>
                            <div class="input-controls">
                                <button class="secondary" id="load-sample">Load Sample</button>
                                <button class="secondary" id="clear-input">Clear</button>
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="output-text">Output:</label>
                            <textarea id="output-text" readonly spellcheck="false" aria-label="HTML entity output"></textarea>
                            <div class="input-controls">
                                <button class="secondary" id="copy-output" data-copy="output-text">Copy</button>
                                <button class="secondary" id="swap-output">Use as Input</button>
                            </div>
                        </div>
                    </div>

                    <div class="text-center">
                        <button class="primary" id="convert-btn">Convert</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <p>
            &copy; <span id="current-year">2025</span> ·
            <a href="https://github.com/irfansofyana/tools" target="_blank" rel="noopener">source</a> ·
            <a href="https://github.com/irfansofyana/tools/issues" target="_blank" rel="noopener">report an issue</a> ·
            <a href="../index.html">all tools</a>
        </p>
    </footer>

    <script src="../js/theme.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('input-text');
            const output = document.getElementById('output-text');
            const encodeNonAscii = document.getElementById('encode-nonascii');

            const named = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;',
            };

            function selectedMode() {
                return document.querySelector('input[name="mode"]:checked').value;
            }

            function encode(value) {
                return value.replace(/[&<>"']|[^\x20-\x7E]/g, (char) => {
                    if (named[char]) return named[char];
                    return encodeNonAscii.checked ? `&#x${char.codePointAt(0).toString(16).toUpperCase()};` : char;
                });
            }

            function decode(value) {
                const textarea = document.createElement('textarea');
                textarea.innerHTML = value;
                return textarea.value;
            }

            function convert() {
                output.value = selectedMode() === 'encode' ? encode(input.value) : decode(input.value);
            }

            document.getElementById('convert-btn').addEventListener('click', convert);
            document.getElementById('load-sample').addEventListener('click', () => {
                input.value = '<button title="Save & close">Save</button>';
                document.querySelector('input[value="encode"]').checked = true;
                convert();
            });
            document.getElementById('clear-input').addEventListener('click', () => {
                input.value = '';
                output.value = '';
                input.focus();
            });
            document.getElementById('swap-output').addEventListener('click', () => {
                input.value = output.value;
                output.value = '';
                input.focus();
            });
            document.querySelectorAll('input[name="mode"], #encode-nonascii').forEach((el) => {
                el.addEventListener('change', convert);
            });
            input.addEventListener('input', convert);
        });
    </script>
</body>
</html>
