<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Format and compress JSON with syntax highlighting">
    <title>JSON Beautifier/Minifier | tools.</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&display=swap">
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="tool-page-shell json-tool">
    <header class="top-bar">
        <a href="../index.html" class="top-bar__brand" aria-label="tools home"><img src="../assets/logo.svg" alt="" width="24" height="24"><span>tools.</span></a>
        <div class="top-bar__spacer"></div>
        <div class="top-bar__actions">
            <a class="icon-btn" href="https://github.com/irfansofyana/tools" target="_blank" rel="noopener" aria-label="GitHub repository">
                <i class="fab fa-github" aria-hidden="true"></i>
            </a>
            <button class="theme-toggle-btn" id="theme-toggle-btn" aria-label="Toggle dark and light theme" aria-pressed="false">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </div>
    </header>

    <main>
        <section class="tool-container">
            <div class="container">
                <a href="../index.html" class="back-link">all tools</a>
                <div class="tool-header">
                    <h1>JSON Beautifier/Minifier</h1>
                </div>
                <div class="tool-description">
                    <p>Format and compress JSON with syntax highlighting. Paste your JSON to beautify or minify it.</p>
                </div>

                <div class="tool-content">
                    <div class="error-message hidden" id="error-message"></div>
                    
                    <div class="input-group">
                        <label for="json-input">JSON Input:</label>
                        <textarea id="json-input" placeholder="Paste your JSON here..." aria-label="JSON input"></textarea>
                        <div class="input-controls">
                            <button class="secondary" id="beautify-btn">Beautify</button>
                            <button class="secondary" id="minify-btn">Minify</button>
                            <button class="secondary" id="clear-btn">Clear</button>
                            <button class="secondary" id="load-sample">Load Sample</button>
                        </div>
                    </div>

                    <div class="options-group mt-2 mb-2">
                        <label>Beautify Options:</label>
                        <div class="options-controls">
                            <label>
                                <input type="number" id="indent-size" value="2" min="1" max="8">
                                Indent Size
                            </label>
                            <label>
                                <input type="checkbox" id="sort-keys" checked>
                                Sort Keys
                            </label>
                            <div id="sort-direction" class="sort-direction-options" style="margin-left: 20px; display: none;">
                                <label>
                                    <input type="radio" name="sort-direction" id="sort-asc" value="asc" checked>
                                    Ascending
                                </label>
                                <label>
                                    <input type="radio" name="sort-direction" id="sort-desc" value="desc">
                                    Descending
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="result-container hidden" id="result-container">
                        <div class="input-group">
                            <label for="json-output">Result:</label>
                            <div class="output-wrapper json-output-shell" role="region" aria-label="Formatted JSON output">
                                <pre id="json-output-wrapper"><code id="json-output" class="language-json"></code></pre>
                            </div>
                            <p class="json-output-meta" id="json-output-meta" aria-live="polite"></p>
                            <div class="input-controls">
                                <button class="secondary" id="copy-btn">Copy to Clipboard</button>
                                <button class="secondary" id="download-btn">Download</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; <span id="current-year">2025</span> tools.. All rights reserved.</p>
            <p>
                <a href="https://github.com/irfansofyana/tools" target="_blank">GitHub</a> |
                <a href="https://github.com/irfansofyana/tools/issues" target="_blank">Report Issues</a>
            </p>
        </div>
    </footer>

    <script src="../js/theme.js"></script>
    <script src="../js/main.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/components/prism-json.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const jsonInput = document.getElementById('json-input');
            const jsonOutput = document.getElementById('json-output');
            const beautifyBtn = document.getElementById('beautify-btn');
            const minifyBtn = document.getElementById('minify-btn');
            const clearBtn = document.getElementById('clear-btn');
            const loadSampleBtn = document.getElementById('load-sample');
            const copyBtn = document.getElementById('copy-btn');
            const downloadBtn = document.getElementById('download-btn');
            const resultContainer = document.getElementById('result-container');
            const outputMeta = document.getElementById('json-output-meta');
            const errorMessage = document.getElementById('error-message');
            const indentSize = document.getElementById('indent-size');
            const sortKeys = document.getElementById('sort-keys');
            const sortDirection = document.getElementById('sort-direction');
            const sortAsc = document.getElementById('sort-asc');
            const sortDesc = document.getElementById('sort-desc');
            
            // Beautify JSON
            function beautifyJSON() {
                const input = jsonInput.value.trim();
                if (!input) {
                    showError('Please enter JSON to beautify', 'error-message');
                    return;
                }
                
                try {
                    // Parse JSON to validate
                    let jsonObj = JSON.parse(input);
                    
                    // Sort keys if option is checked
                    if (sortKeys.checked) {
                        const direction = sortAsc.checked ? 'asc' : 'desc';
                        jsonObj = sortObjectKeys(jsonObj, direction);
                    }
                    
                    // Stringify with indentation
                    const spaces = parseInt(indentSize.value) || 2;
                    const beautified = JSON.stringify(jsonObj, null, spaces);
                    
                    renderOutput(beautified, 'beautified.json', 'Beautified');
                } catch (error) {
                    showError(`Error: ${error.message}`, 'error-message');
                }
            }
            
            // Minify JSON
            function minifyJSON() {
                const input = jsonInput.value.trim();
                if (!input) {
                    showError('Please enter JSON to minify', 'error-message');
                    return;
                }
                
                try {
                    // Parse JSON to validate
                    let jsonObj = JSON.parse(input);
                    
                    // Stringify without indentation
                    const minified = JSON.stringify(jsonObj);
                    
                    renderOutput(minified, 'minified.json', 'Minified');
                } catch (error) {
                    showError(`Error: ${error.message}`, 'error-message');
                }
            }

            function renderOutput(content, filename, mode) {
                jsonOutput.textContent = content;
                Prism.highlightElement(jsonOutput);

                const lineCount = content ? content.split('\n').length : 0;
                const charCount = content.length.toLocaleString();
                outputMeta.textContent = `${mode} - ${lineCount.toLocaleString()} line${lineCount === 1 ? '' : 's'} - ${charCount} chars`;

                resultContainer.classList.remove('hidden');
                errorMessage.classList.add('hidden');
                updateDownloadButton(content, filename);
            }
            
            // Sort object keys recursively
            function sortObjectKeys(obj, direction = 'asc') {
                // If not an object or is null, return as is
                if (typeof obj !== 'object' || obj === null) {
                    return obj;
                }
                
                // If array, sort each element
                if (Array.isArray(obj)) {
                    return obj.map(item => sortObjectKeys(item, direction));
                }
                
                // Create a new object with sorted keys
                return Object.keys(obj)
                    .sort((a, b) => {
                        if (direction === 'asc') {
                            return a.localeCompare(b);
                        } else {
                            return b.localeCompare(a);
                        }
                    })
                    .reduce((result, key) => {
                        result[key] = sortObjectKeys(obj[key], direction);
                        return result;
                    }, {});
            }
            
            // Update download button
            function updateDownloadButton(content, filename) {
                downloadBtn.onclick = () => {
                    downloadTextFile(content, filename, 'application/json');
                };
            }
            
            // Event listeners
            beautifyBtn.addEventListener('click', beautifyJSON);
            minifyBtn.addEventListener('click', minifyJSON);
            
            // Toggle sort direction options visibility
            sortKeys.addEventListener('change', () => {
                if (sortKeys.checked) {
                    sortDirection.style.display = 'block';
                } else {
                    sortDirection.style.display = 'none';
                }
            });
            
            // Initialize sort direction visibility
            if (sortKeys.checked) {
                sortDirection.style.display = 'block';
            }
            
            clearBtn.addEventListener('click', () => {
                jsonInput.value = '';
                resultContainer.classList.add('hidden');
                errorMessage.classList.add('hidden');
                outputMeta.textContent = '';
            });
            
            loadSampleBtn.addEventListener('click', () => {
                jsonInput.value = JSON.stringify({
                    "name": "tools.",
                    "version": "1.0.0",
                    "description": "A collection of developer tools",
                    "features": [
                        "JSON/YAML Converter",
                        "Cron Parser",
                        "Timestamp Converter",
                        "JSON Beautifier/Minifier",
                        "Text Diff Utility"
                    ],
                    "settings": {
                        "theme": "dark",
                        "autoSave": true,
                        "notifications": {
                            "enabled": true,
                            "frequency": "daily"
                        }
                    },
                    "stats": {
                        "users": 1000,
                        "tools": 5,
                        "rating": 4.9
                    },
                    "lastUpdated": "2025-05-02T10:16:11+07:00"
                });
                beautifyJSON();
            });
            
            // Custom copy function for syntax highlighted code
            copyBtn.addEventListener('click', () => {
                const textToCopy = jsonOutput.textContent;
                
                navigator.clipboard.writeText(textToCopy)
                    .then(() => {
                        const originalText = copyBtn.textContent;
                        copyBtn.textContent = 'Copied!';
                        
                        setTimeout(() => {
                            copyBtn.textContent = originalText;
                        }, 2000);
                    })
                    .catch(err => {
                        console.error('Failed to copy text: ', err);
                    });
            });
            
            // Re-highlight output when theme changes so Prism token classes stay current.
            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    if (mutation.attributeName === 'data-theme') {
                        if (jsonOutput.textContent) {
                            Prism.highlightElement(jsonOutput);
                        }
                    }
                });
            });
            
            observer.observe(document.documentElement, { attributes: true });
        });
    </script>
    
    <style>
        body.json-tool {
            --json-surface: #fbfcfb;
            --json-gutter: #f1f4f3;
            --json-border: #d7dfdc;
            --json-text: #1b2424;
            --json-muted: #7b8785;
            --json-property: #0f6f86;
            --json-string: #167342;
            --json-number: #8a5a00;
            --json-literal: #9a3f62;
            --json-punctuation: #65706e;
        }

        [data-theme="dark"] body.json-tool {
            --json-surface: #0b1114;
            --json-gutter: #11191d;
            --json-border: #26353b;
            --json-text: #d8e5e4;
            --json-muted: #819195;
            --json-property: #7ec7ff;
            --json-string: #9be7ac;
            --json-number: #ffd37d;
            --json-literal: #ff9db7;
            --json-punctuation: #a7b4b6;
        }

        body.json-tool .json-output-shell {
            max-height: min(58vh, 680px);
            overflow: auto;
            border: 1px solid var(--json-border) !important;
            border-radius: var(--panel-radius);
            background:
                linear-gradient(90deg, var(--json-gutter) 0 3.25rem, transparent 3.25rem),
                var(--json-surface) !important;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }
        
        body.json-tool #json-output-wrapper {
            margin: 0;
            padding: 1.35rem 1.4rem 1.35rem 3.85rem;
            border: 0 !important;
            border-radius: 0;
            background: transparent !important;
            color: var(--json-text) !important;
            box-shadow: none;
            tab-size: 2;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        body.json-tool #json-output {
            display: block;
            background: transparent !important;
            color: var(--json-text) !important;
            border-radius: 0;
            font-size: 0.95rem;
            font-variant-ligatures: none;
            font-feature-settings: "liga" 0, "calt" 0;
            line-height: 1.65;
            text-shadow: none;
        }

        body.json-tool #json-output .token.property {
            color: var(--json-property) !important;
        }

        body.json-tool #json-output .token.string {
            color: var(--json-string) !important;
        }

        body.json-tool #json-output .token.number {
            color: var(--json-number) !important;
        }

        body.json-tool #json-output .token.boolean,
        body.json-tool #json-output .token.null {
            color: var(--json-literal) !important;
        }

        body.json-tool #json-output .token.punctuation,
        body.json-tool #json-output .token.operator {
            color: var(--json-punctuation) !important;
        }

        body.json-tool .json-output-meta {
            margin: 0.75rem 0 0;
            color: var(--text-muted);
            font-size: var(--text-xs);
        }
        
        .options-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .options-controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .options-controls label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        #indent-size {
            width: 3rem;
            padding: 0.25rem;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            color: var(--text-primary);
        }
        
        @media (max-width: 640px) {
            body.json-tool .json-output-shell {
                max-height: 52vh;
                background:
                    linear-gradient(90deg, var(--json-gutter) 0 2.5rem, transparent 2.5rem),
                    var(--json-surface) !important;
            }

            body.json-tool #json-output-wrapper {
                padding: 1rem 1rem 1rem 3rem;
            }

            body.json-tool #json-output {
                font-size: 0.86rem;
            }
        }
    </style>
</body>
</html>
