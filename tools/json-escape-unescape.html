<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Escape and unescape JSON strings">
    <title>JSON Escape/Unescape | tools.</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&display=swap">
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="tool-page-shell">
    <header class="top-bar">
        <a href="../index.html" class="top-bar__brand" aria-label="tools home"><img src="../assets/logo.svg" alt="" width="24" height="24"><span>tools.</span></a>
        <div class="top-bar__spacer"></div>
        <div class="top-bar__actions">
            <a class="icon-btn" href="https://github.com/irfansofyana/tools" target="_blank" rel="noopener" aria-label="GitHub repository">
                <i class="fab fa-github" aria-hidden="true"></i>
            </a>
            <button class="theme-toggle-btn" id="theme-toggle-btn" aria-label="Toggle dark and light theme" aria-pressed="false">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </div>
    </header>

    <main>
        <section class="tool-container">
            <div class="container">
                <a href="../index.html" class="back-link">all tools</a>
                <div class="tool-header">
                    <h1>JSON Escape/Unescape</h1>
                </div>
                <div class="tool-description">
                    <p>Convert plain text into JSON-safe escaped text, or turn escaped JSON string content back into readable text.</p>
                </div>

                <div class="tool-content">
                    <div class="error-message hidden" id="error-message"></div>

                    <div class="options-group">
                        <label>Mode:</label>
                        <div class="options-controls">
                            <label><input type="radio" name="mode" value="escape" checked> Escape</label>
                            <label><input type="radio" name="mode" value="unescape"> Unescape</label>
                            <label><input type="checkbox" id="include-quotes"> Include surrounding quotes</label>
                        </div>
                    </div>

                    <div class="preview-container">
                        <div class="input-group">
                            <label for="input-text">Input:</label>
                            <textarea id="input-text" spellcheck="false" placeholder="Paste text or escaped JSON string content..."></textarea>
                            <div class="input-controls">
                                <button class="secondary" id="load-sample">Load Sample</button>
                                <button class="secondary" id="clear-input">Clear</button>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="output-text">Output:</label>
                            <textarea id="output-text" readonly spellcheck="false" aria-label="Escaped or unescaped output"></textarea>
                            <div class="input-controls">
                                <button class="secondary" id="copy-output" data-copy="output-text">Copy</button>
                                <button class="secondary" id="swap-output">Use as Input</button>
                            </div>
                        </div>
                    </div>

                    <div class="text-center">
                        <button class="primary" id="convert-btn">Convert</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; <span id="current-year">2025</span> tools.. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/theme.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('input-text');
            const output = document.getElementById('output-text');
            const includeQuotes = document.getElementById('include-quotes');
            const error = document.getElementById('error-message');

            function selectedMode() {
                return document.querySelector('input[name="mode"]:checked').value;
            }

            function showLocalError(message) {
                error.textContent = message;
                error.classList.remove('hidden');
                setTimeout(() => error.classList.add('hidden'), 5000);
            }

            function convert() {
                try {
                    error.classList.add('hidden');
                    if (selectedMode() === 'escape') {
                        const escaped = JSON.stringify(input.value);
                        output.value = includeQuotes.checked ? escaped : escaped.slice(1, -1);
                        return;
                    }

                    const value = input.value.trim();
                    const literal = value.startsWith('"') && value.endsWith('"') ? value : `"${value}"`;
                    const parsed = JSON.parse(literal);
                    if (typeof parsed !== 'string') throw new Error('Input must decode to a JSON string');
                    output.value = parsed;
                } catch (err) {
                    output.value = '';
                    showLocalError(`Could not convert: ${err.message}`);
                }
            }

            document.getElementById('convert-btn').addEventListener('click', convert);
            document.getElementById('load-sample').addEventListener('click', () => {
                input.value = 'Line 1\n"quoted text" and a tab\tplus \\ slashes';
                document.querySelector('input[value="escape"]').checked = true;
                convert();
            });
            document.getElementById('clear-input').addEventListener('click', () => {
                input.value = '';
                output.value = '';
                input.focus();
            });
            document.getElementById('swap-output').addEventListener('click', () => {
                input.value = output.value;
                output.value = '';
                input.focus();
            });
            document.querySelectorAll('input[name="mode"], #include-quotes').forEach((el) => {
                el.addEventListener('change', convert);
            });
            input.addEventListener('input', convert);
        });
    </script>
</body>
</html>
